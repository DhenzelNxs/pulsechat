<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569" />
    </marker>
  </defs>

  <rect width="860" height="460" fill="#ffffff" />

  <!-- Frontend -->
  <rect x="40" y="40" width="220" height="110" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5" />
  <text x="150" y="70" text-anchor="middle" font-size="15" font-weight="600" fill="#1e1b4b">Frontend</text>
  <text x="150" y="92" text-anchor="middle" font-size="12" fill="#3730a3">Vite + React + TS</text>
  <text x="150" y="110" text-anchor="middle" font-size="12" fill="#3730a3">TanStack Query</text>
  <text x="150" y="128" text-anchor="middle" font-size="12" fill="#3730a3">Vercel project</text>

  <!-- API -->
  <rect x="340" y="40" width="220" height="110" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" />
  <text x="450" y="70" text-anchor="middle" font-size="15" font-weight="600" fill="#064e3b">API</text>
  <text x="450" y="92" text-anchor="middle" font-size="12" fill="#065f46">Express + TypeScript</text>
  <text x="450" y="110" text-anchor="middle" font-size="12" fill="#065f46">JWT auth, Zod validation</text>
  <text x="450" y="128" text-anchor="middle" font-size="12" fill="#065f46">Vercel project (serverless)</text>

  <!-- MongoDB -->
  <rect x="640" y="40" width="180" height="110" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5" />
  <text x="730" y="70" text-anchor="middle" font-size="15" font-weight="600" fill="#14532d">MongoDB Atlas</text>
  <text x="730" y="92" text-anchor="middle" font-size="12" fill="#166534">Users, Rooms,</text>
  <text x="730" y="110" text-anchor="middle" font-size="12" fill="#166534">Messages</text>

  <!-- Pusher -->
  <rect x="290" y="300" width="320" height="130" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="1.5" />
  <text x="450" y="330" text-anchor="middle" font-size="15" font-weight="600" fill="#7c2d12">Pusher Channels</text>
  <text x="450" y="354" text-anchor="middle" font-size="12" fill="#9a3412">private-room-{roomId} — message:new, typing</text>
  <text x="450" y="374" text-anchor="middle" font-size="12" fill="#9a3412">presence-room-{roomId} — online/offline</text>
  <text x="450" y="394" text-anchor="middle" font-size="12" fill="#9a3412">private-user-{userId} — mentions</text>
  <text x="450" y="416" text-anchor="middle" font-size="11" font-style="italic" fill="#c2410c">client never holds the Pusher secret key</text>

  <!-- Frontend <-> API : REST -->
  <line x1="260" y1="80" x2="340" y2="80" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)" />
  <text x="300" y="68" text-anchor="middle" font-size="11" fill="#334155">REST (JWT)</text>

  <!-- API <-> MongoDB -->
  <line x1="560" y1="90" x2="640" y2="90" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)" />

  <!-- API -> Pusher : trigger (server key) -->
  <line x1="470" y1="150" x2="470" y2="300" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="610" y="220" text-anchor="middle" font-size="11" fill="#334155">trigger event</text>
  <text x="610" y="236" text-anchor="middle" font-size="11" fill="#334155">(server key, via API)</text>

  <!-- Frontend -> Pusher : subscribe (client key) -->
  <line x1="190" y1="150" x2="330" y2="300" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="150" y="220" text-anchor="middle" font-size="11" fill="#334155">subscribe</text>
  <text x="150" y="236" text-anchor="middle" font-size="11" fill="#334155">(short-lived auth token</text>
  <text x="150" y="252" text-anchor="middle" font-size="11" fill="#334155">from /api/pusher/auth)</text>
</svg>
